<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ATI Nawalapitiya</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <style>
body {
    background-color: #121212; 
    color: #FFFFFF; 
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Poppins, sans-serif;
}

.header {
    width: 97%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    position: fixed;
    top: 0;
    left: 0;
    background: rgba(10, 25, 47, 0.3);
    backdrop-filter: blur(10px); 
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
}

.header:hover {
    transform: translateY(-2px);
    background: rgba(10, 25, 47, 0.4);
}

.logo img {
    width: 80px;
    height: 100px;
}

.logoati img {
    width: 80px;
    height: 100px;
    border-radius: 45px;
    border: 2px solid rgba(255, 255, 255, 0.3); 
}

/* Navbar */
.navbar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2rem;
    background: rgba(44, 54, 64, 0.3);
    backdrop-filter: blur(10px);
    padding: 0.5rem 1rem;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: background 0.3s ease;
}

.navbar:hover {
    background: rgba(44, 54, 64, 0.4);
}

.navbar a {
    color: #FFFFFF;
    text-decoration: none;
    font-size: 1.5rem;
    font-weight: bold;
    transition: transform 0.3s ease;
}

.navbar a:hover {
    color: #FFFFFF;
    transform: scale(1.05);
}

.signin a {
    color: #FFFFFF; 
    text-decoration: none;
    font-size: 1.5rem;
    font-weight: bold;
    transition: transform 0.3s ease;
}

.signin a:hover {
    color: #FFFFFF; 
    transform: scale(1.05);
}

/* Content */
.content {
    padding-top: 180px;
    width: 90%;
    max-width: 800px;
    margin-top: 200px;
    text-align: center;
    background: rgba(44, 54, 64, 0.3); 
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 2rem;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
}

.content:hover {
    transform: translateY(-5px);
    background: rgba(44, 54, 64, 0.4);
}

.content form {
    text-align: left;
    background: rgba(44, 54, 64, 0.2); 
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease, scale 0.4s ease;
}

.content form:hover {
    transform: translateY(-5px) scale(1.01);
    background: rgba(44, 54, 64, 0.3);
}

.content input, 
.content textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    font-family: Poppins, sans-serif;
    background: rgba(44, 54, 64, 0.2); 
    backdrop-filter: blur(5px);
    color: #FFFFFF; 
    transition: background 0.3s ease;
}

.content input:focus, 
.content textarea:focus {
    outline: none;
    background: rgba(44, 54, 64, 0.3);
}

.content input::placeholder,
.content textarea::placeholder {
    color: #E0E0E0;
}

.content button {
    background: rgba(10, 25, 47, 0.3); 
    color: #FFFFFF;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}

.content button:hover {
    transform: translateY(-2px);
    background: rgba(10, 25, 47, 0.4);
}

/* Footer */
.footer {
    background: rgba(44, 54, 64, 0.3); 
    backdrop-filter: blur(10px);
    color: #E0E0E0;
    width: 100%;
    margin-top: 80px;
    text-align: center;
    padding: 5px 5px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
}

.footer:hover {
    transform: scale(1.01);
    background: rgba(44, 54, 64, 0.4);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>
    <!-- Header -->
    <div class="header">
    <!-- Sliate logo -->
        <div class="logo">
            <img src="PHOTOS/sliate.jpg" alt="Logo">
        </div>
    <!-- Navbar -->
        <div class="navbar">
            <a href="aboutus.html">About Us</a>
            <a href="contectus.html">Contact Us</a>
    <!-- Sign In -->
        <div class="signin">
            <a href="signin.html"><u>Sign In</u></a>
        </div>
        </div>
    <!--Ati logo-->
        <div class="logoati">
            <img src="PHOTOS/LOGO.png" alt="Logo">
        </div>
    </div>

<!-- Content -->
    <div class="content">
        <h1>Advanced Technological Institute - Nawalapitiya</h1>
        <h2>Contact Us</h2>
        <p>Feel free to get in touch with us using the form below.</p>

        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br>

            <button type="submit">Send Message</button>
        </form>
    </div>
    
<!-- Footer -->
    <footer class="footer">
        <div>
            <h4>Copyright © 2025 - ATI Nawalapitiya ALL RIGHT RESERVED.</h4>
        </div>
    </footer>
    
</body>
</html>
