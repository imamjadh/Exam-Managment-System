<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
</head>
<style>
* {
    font-family: Poppins, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background-color: #121212;
    color: #FFFFFF;
}

/* Header */
.header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    top: 0;
    left: 0;
    background: rgba(10, 25, 47, 0.3); 
    color: #FFFFFF; 
    backdrop-filter: blur(10px); 
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
}

.header:hover {
    transform: translateY(-2px);
    background: rgba(10, 25, 47, 0.4); 
}

.logo img {
    width: 80px;
    height: 100px;
}

.logoati img {
    width: 80px;
    height: 100px;
    border-radius: 45px;
    border: 2px solid rgba(255, 255, 255, 0.3); 
}

.head {
    text-align: center;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
    color: #FFFFFF; 
}

/* Content */
.content {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 50px;
    padding-bottom: 50px;
    background: rgba(44, 54, 64, 0.3);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 2rem;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
}

.content:hover {
    transform: translateY(-5px);
    background: rgba(44, 54, 64, 0.4);
}

.container {
    background: rgba(44, 54, 64, 0.3); 
    backdrop-filter: blur(10px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
    width: 768px;
    max-width: 100%;
    min-height: 480px;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
}

.container:hover {
    transform: scale(1.01);
    background: rgba(44, 54, 64, 0.4);
}

.container p {
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.3px;
    margin: 20px 0;
    color: #E0E0E0;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.2s forwards;
}

.container span {
    font-size: 12px;
    color: #E0E0E0; 
    opacity: 0;
    animation: fadeIn 0.5s ease 0.3s forwards;
}

.container a {
    color: #FFFFFF; 
    font-size: 13px;
    text-decoration: none;
    margin: 15px 0 10px;
    transition: transform 0.3s ease;
}

.container a:hover {
    color: #FFFFFF; 
    transform: scale(1.05);
}

.container button {
    background: rgba(10, 25, 47, 0.3); 
    color: #FFFFFF; 
    font-size: 12px;
    padding: 10px 45px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 10px;
    cursor: pointer;
    transition: transform 0.3s ease, background 0.3s ease;
}

.container button:hover {
    transform: translateY(-2px);
    background: rgba(10, 25, 47, 0.4);
}

.container button.hidden {
    background: rgba(44, 54, 64, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.2); 
    color: #FFFFFF;
}

.container form {
    background: rgba(44, 54, 64, 0.2); 
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 40px;
    height: 100%;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.container input {
    background: rgba(44, 54, 64, 0.2); 
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.2); 
    margin: 8px 0;
    padding: 10px 15px;
    font-size: 13px;
    border-radius: 8px;
    width: 100%;
    outline: none;
    color: #FFFFFF; 
    transition: background 0.3s ease;
}

.container input:focus {
    background: rgba(44, 54, 64, 0.3);
}

.container input::placeholder {
    color: #E0E0E0; 
}

.form-container {
    position: absolute;
    top: 0;
    height: 100%;
    transition: all 0.6s ease-in-out;
}

.sign-in {
    left: 0;
    width: 50%;
    z-index: 2;
}

.container.active .sign-in {
    transform: translateX(100%);
}

.sign-up {
    left: 0;
    width: 50%;
    opacity: 0;
    z-index: 1;
}

.container.active .sign-up {
    transform: translateX(100%);
    opacity: 1;
    z-index: 5;
    animation: move 0.6s;
}

@keyframes move {
    0%, 49.99% {
        opacity: 0;
        z-index: 1;
    }
    50%, 100% {
        opacity: 1;
        z-index: 5;
    }
}

.social-icons {
    margin: 20px 0;
}

.social-icons a {
    border: 1px solid rgba(255, 255, 255, 0.2); 
    border-radius: 20%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 3px;
    width: 40px;
    height: 40px;
    color: #FFFFFF; 
    transition: transform 0.3s ease, background 0.3s ease;
}

.social-icons a:hover {
    transform: scale(1.1);
    background: rgba(44, 54, 64, 0.3);
}

.toggle-container {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    overflow: hidden;
    transition: all 0.6s ease-in-out;
    border-radius: 150px 0 0 100px;
    z-index: 1000;
}

.container.active .toggle-container {
    transform: translateX(-100%);
    border-radius: 0 150px 100px 0;
}

.toggle {
    background: rgba(44, 54, 64, 0.3); 
    backdrop-filter: blur(10px);
    height: 100%;
    color: #FFFFFF;
    position: relative;
    left: -100%;
    height: 100%;
    width: 200%;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.container.active .toggle {
    transform: translateX(50%);
}

.toggle-panel {
    position: absolute;
    width: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 30px;
    text-align: center;
    top: 0;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.toggle-panel p {
    color: #E0E0E0; 
}

.toggle-left {
    transform: translateX(-200%);
}

.container.active .toggle-left {
    transform: translateX(0);
}

.toggle-right {
    right: 0;
    transform: translateX(0);
}

.container.active .toggle-right {
    transform: translateX(200%);
}

/* Footer */
.footer {
    padding: 10px 10px;
    background: rgba(44, 54, 64, 0.3);
    backdrop-filter: blur(10px);
    color: #E0E0E0; 
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
}

.footer:hover {
    transform: scale(1.01);
    background: rgba(44, 54, 64, 0.4);
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
